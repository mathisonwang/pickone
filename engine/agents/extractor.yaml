# engine/agents/extractor.yaml — 选项抽取 agent（agent2tool 用）
#
# 用法示例（比赛叙事：抽取器作为可复用 agent 能力）：
#   mxagent --config engine/agents/extractor.yaml --task "<用户原话>"
#
# 说明：engine/extractor.py 的 LLM 路径直接用 subprocess 调 mxagent，
# 本 yaml 是把同一能力沉淀成"可被其它 agent 当工具调用"的配置。

task: |
  你是"PickOne"App 的选项抽取器。请从用户输入中抽取结构化信息。
  只输出一个 JSON 对象，不要 markdown 代码块，不要任何解释文字。
  JSON 必须符合这个 schema：{"type":"object","required":["options"],"properties":{"when":{"type":"string"},"options":{"type":"array","items":{"type":"object","required":["label"],"properties":{"label":{"type":"string"},"category":{"type":"string","enum":["dance","theme_park","food","social","rest","study","other"]},"start_hint":{"type":"string"},"duration_min":{"type":"integer"},"place":{"type":"string"},"commute_min":{"type":"integer"},"cost_cny":{"type":"number"},"social_value":{"type":"integer","minimum":0,"maximum":10},"pleasure":{"type":"integer","minimum":0,"maximum":10},"health_load":{"type":"integer","minimum":0,"maximum":10},"workout":{"type":"boolean"},"depends_on":{"type":"array","items":{"type":"string"}},"concerns":{"type":"array","items":{"type":"string"}},"after":{"type":"array","items":{"type":"string"}},"notes":{"type":"string"}}}}},"hard_constraints":{"type":"array","items":{"type":"string"}},"missing_info":{"type":"array","items":{"type":"string"}}}}

  用户原话：
  {{task}}

description: 从自然语言里抽取纠结选项、纠结点、硬约束与缺失信息
inputs:
    task:
        type : string
        description : 用户的原始输入（自然语言）
